name: experiments

# Runs the full comparison on GitHub's servers (they can download the OpenML datasets)
# and commits the result tables to the branch.
# Start it from the Actions tab ("Run workflow"), or push a commit whose message contains [run-experiments].
on:
  workflow_dispatch:
  push:

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-experiments]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python run_experiments.py --out results
      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Add experiment results" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
